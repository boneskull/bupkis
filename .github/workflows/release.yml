name: Release Please

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      paths:
        description: >
          Workspace paths to publish (comma-separated, e.g.
          "packages/bupkis,packages/sinon"). Use this to manually re-run a
          publish that release-please failed to trigger; it skips
          release-please entirely.
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # A manual dispatch supplies its own paths and must never grant
    # release-please write access to contents/PRs.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Create Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0

  pack:
    name: Pack Released Workspaces
    runs-on: ubuntu-latest
    needs: release-please
    # needs.release-please is skipped (not "success") on workflow_dispatch,
    # so this must run unconditionally and branch on the event type instead.
    if: always() && (github.event_name == 'workflow_dispatch' || (needs.release-please.result == 'success' && needs.release-please.outputs.releases_created == 'true'))
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - name: Determine paths to pack
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_PATHS: ${{ inputs.paths }}
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            json=$(echo "$INPUTS_PATHS" | jq -cR 'split(",") | map(gsub("^\\s+|\\s+$"; ""))')
          else
            json="$PATHS_RELEASED"
          fi
          echo "json=$json" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pack
        uses: ./.github/actions/pack
        with:
          paths-released: ${{ steps.paths.outputs.json }}

  publish:
    name: Publish Released Workspaces
    runs-on: ubuntu-latest
    needs: pack
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    if: needs.pack.result == 'success' && needs.pack.outputs.files != '[]'
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/publish
        with:
          files: ${{ needs.pack.outputs.files }}
